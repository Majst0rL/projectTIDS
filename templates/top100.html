<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najbolj izposojene knjige v Sloveniji</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        async function triggerScraping() {
            const response = await fetch('/top100/scrape', { method: 'POST' });
            if (response.ok) {
                alert("Scraping completed successfully!");
                location.reload();
            } else {
                alert("Failed to scrape data.");
            }
        }
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Book Explorer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/search">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="/top100">Top 100 Slovenia</a></li>
                    <li class="nav-item"><a class="nav-link" href="/mylist">My List</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/opendata">Open Data</a></li>
                    <li class="nav-item"><a class="nav-link" href="/rabbitmq/rabbitmq">RabbitMQ</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Najbolj izposojene knjige v Sloveniji</h1>
        <button class="btn btn-primary mb-4" onclick="triggerScraping()">Osveži podatke</button>
        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Naslov</th>
                        <th>Avtor</th>
                        <th>Število izposoj</th>
                    </tr>
                </thead>
                <tbody>
                    {% for book in books %}
                    <tr>
                        <td>{{ book['title'] }}</td>
                        <td>{{ book['author'] }}</td>
                        <td>{{ book['loans'] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
