<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        async function addBook() {
            const title = prompt("Enter book title:");
            const author = prompt("Enter book author:");
            const genre = prompt("Enter book genre:");
            const year = prompt("Enter book year:");
            const rating = prompt("Enter book rating:");

            const response = await fetch('/mylist', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, author, genre, year, rating })
            });

            if (response.ok) {
                alert("Book added successfully!");
                location.reload();
            } else {
                alert("Failed to add book.");
            }
        }

        async function updateBook(bookId) {
            const title = prompt("Enter new book title:");
            const author = prompt("Enter new book author:");
            const genre = prompt("Enter new book genre:");
            const year = prompt("Enter new book year:");
            const rating = prompt("Enter new book rating:");

            const response = await fetch(`/mylist/${bookId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, author, genre, year, rating })
            });

            if (response.ok) {
                alert("Book updated successfully!");
                location.reload();
            } else {
                alert("Failed to update book.");
            }
        }

        async function deleteBook(bookId) {
            const response = await fetch(`/mylist/${bookId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                alert("Book deleted successfully!");
                location.reload();
            } else {
                alert("Failed to delete book.");
            }
        }
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Book Explorer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/search">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="/top100">Top 100 Slovenia</a></li>
                    <li class="nav-item"><a class="nav-link" href="/mylist">My List</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/opendata">Open Data</a></li>
                    <li class="nav-item"><a class="nav-link" href="/rabbitmq/rabbitmq">RabbitMQ</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>My Book List</h1>
        <button class="btn btn-success mb-4" onclick="addBook()">Add Book</button>
        <div class="row mt-4">
            {% for book in books %}
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">{{ book['title'] }}</h5>
                        <p class="card-text"><strong>Author:</strong> {{ book['author'] }}</p>
                        <p class="card-text"><strong>Year:</strong> {{ book['year'] }}</p>
                        <p class="card-text"><strong>Genre:</strong> {{ book['genre'] }}</p>
                        <p class="card-text"><strong>Rating:</strong> {{ book['rating'] }}</p>
                        <button class="btn btn-primary" onclick="updateBook({{ book['id'] }})">Update</button>
                        <button class="btn btn-danger" onclick="deleteBook({{ book['id'] }})">Delete</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
