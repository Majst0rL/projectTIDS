<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RabbitMQ Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Book Explorer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/search">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="/top100">Top 100 Slovenia</a></li>
                    <li class="nav-item"><a class="nav-link" href="/mylist">My List</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/opendata">Open Data</a></li>
                    <li class="nav-item"><a class="nav-link" href="/rabbitmq/rabbitmq">RabbitMQ</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>RabbitMQ Demo</h1>
        <button id="publishEvent" class="btn btn-primary">Publish Event</button>
    </div>

    <script>
        document.getElementById("publishEvent").addEventListener("click", async () => {
            const response = await fetch('/rabbitmq/rabbitmq', {  // Updated URL
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            });
            const result = await response.json();
            alert(result.message);
        });

    </script>
</body>
</html>
