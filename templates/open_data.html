<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Data Visualization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Book Explorer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/search">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="/top100">Top 100 Slovenia</a></li>
                    <li class="nav-item"><a class="nav-link" href="/mylist">My List</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/opendata">Open Data</a></li>
                    <li class="nav-item"><a class="nav-link" href="/rabbitmq/rabbitmq">RabbitMQ</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Open Data Visualization</h1>
        <canvas id="openDataChart" width="800" height="400"></canvas>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/opendata/data');
                const data = await response.json();

                if (data.error) {
                    console.error("Error loading data: ", data.error);
                    alert("Error loading data: " + data.error);
                    return;
                }

                const ctx = document.getElementById('openDataChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: data.datasets
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top',
                            },
                            tooltip: {
                                callbacks: {
                                    label: function (context) {
                                        return `${context.dataset.label}: ${context.raw.toFixed(2)}%`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Percentage (%)'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Year'
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error("Error fetching data: ", error);
                alert("Error fetching data: " + error.message);
            }
        }

    fetchData();

    </script>
</body>
</html>
